# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - iotempe

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_11A28A0249BB49F0AEBD5DD30B5C7954 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_11E00FC1F10A45FFBACA85F523ED169B }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_11A28A0249BB49F0AEBD5DD30B5C7954 }}/muhammadmaashnursalim02/iotkopiii/iot-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C3B8F6E427D4B64ACA80389FA5BCA8D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CFD0B92D8AAE44ACBA72E09FB65E401A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_78C1A9855321463C89D9E8CBC7962E99 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'iotempe'
          slot-name: 'Production'
          images: 'ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_11A28A0249BB49F0AEBD5DD30B5C7954 }}/muhammadmaashnursalim02/iotkopiii/iot-backend:${{ github.sha }}'
          