name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: DashboardIoT

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.PAT_TOKEN }}" | docker login ghcr.io -u muhammadmaashnursalim02 --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ghcr.io/muhammadmaashnursalim02/iotkopiii/iot-backend:latest .
          docker push ghcr.io/muhammadmaashnursalim02/iotkopiii/iot-backend:latest

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'ghcr.io/muhammadmaashnursalim02/iotkopiii/iot-backend:latest'
