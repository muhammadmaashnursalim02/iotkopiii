[package]
name = "backend-iot"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "derive", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
rumqttc = "0.25.1"
reqwest = { version = "0.13.4", features = ["json"] }
webpki-roots = "1.0.9"
rustls = "0.23.44"
